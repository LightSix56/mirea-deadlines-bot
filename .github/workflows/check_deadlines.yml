name: Check MIREA Deadlines

on:
  schedule:
    # Запуск каждые 30 минут круглосуточно
    - cron: '*/30 * * * *'
  workflow_dispatch: # Возможность ручного запуска кнопкой в GitHub

jobs:
  check-deadlines:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx python-dotenv

      - name: Run Deadlines Checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CALENDAR_URL: ${{ secrets.CALENDAR_URL }}
        run: |
          python check_deadlines.py

      - name: Commit and push state changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add events_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update events state [skip ci]" && git push)
